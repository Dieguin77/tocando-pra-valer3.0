    <!-- Anti-FOUC: aplica o tema salvo antes do React montar -->
    <script>
      (function () {
        try {
          const saved = localStorage.getItem('theme');
          let theme = saved;
          if (!theme) {
            const prefersDark =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = prefersDark ? 'dark' : 'light';
          }
          const apply = (el) => {
            if (!el) return;
            if (theme === 'dark') el.classList.add('dark-mode');
            else el.classList.remove('dark-mode');
          };
          apply(document.documentElement);
          if (document.body) apply(document.body);
          else document.addEventListener('DOMContentLoaded', () => apply(document.body));
        } catch (e) {}
      })();
    </script>
